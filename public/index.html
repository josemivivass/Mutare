        <svg viewBox="0 0 40 40" aria-hidden="true">
          <path d="M10 3.5h14.2l8.3 8.3V34a2.5 2.5 0 0 1-2.5 2.5H10A2.5 2.5 0 0 1 7.5 34V6A2.5 2.5 0 0 1 10 3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
