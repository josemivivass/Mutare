<!doctype html>
<html lang="es">

  <header class="topbar">
    <div class="topbar-inner">
      <a class="marca" href="#" aria-label="Mutare, ir al inicio">
        <!-- Logo: una hoja de archivo con la M de Mutare y dos flechas que giran alrededor (convertir) -->
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <path d="M8.5 3.5h16l7.5 7.5v24a2 2 0 0 1-2 2H8.5a2 2 0 0 1-2-2v-29.5a2 2 0 0 1 2-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M24.5 3.5v5.5a2 2 0 0 0 2 2H32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M14.6 25.4v-8.6l4.9 6 4.9-6v8.6" fill="none" stroke="var(--acento)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>

      </a>
      <span class="miga" id="miga" hidden></span>
      <div class="acciones-top">
        <input type="search" id="buscar" class="buscar-top" placeholder="Buscar herramienta…" aria-label="Buscar herramienta" autocomplete="off" enterkeyhint="search">
        <button class="btn-icono btn-tema" id="btn-tema" type="button"></button>
      </div>
    </div>

  <main class="contenido" id="contenido"></main>

  <div class="avisos" id="avisos" aria-live="polite"></div>
  <noscript><p class="contenido">Esta página necesita JavaScript: los archivos se procesan en tu propio navegador.</p></noscript>
