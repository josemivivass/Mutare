<!doctype html>
<html lang="es">
<head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="marca" href="#" aria-label="PDF Converter, ir al inicio">
        <!-- Logo: una hoja con la esquina doblada y dos flechas que se cruzan -->
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <path d="M10 3.5h14.2l8.3 8.3V34a2.5 2.5 0 0 1-2.5 2.5H10A2.5 2.5 0 0 1 7.5 34V6A2.5 2.5 0 0 1 10 3.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>

          <path d="M12.5 19.5h12m-3.6-3.6 3.6 3.6-3.6 3.6M27.5 28h-12m3.6-3.6-3.6 3.6 3.6 3.6" fill="none" stroke="var(--acento)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="marca-nombre">PDF Converter</span>
      </a>
      <span class="miga" id="miga" hidden></span>
      <div class="acciones-top">
        <button class="btn-icono btn-tema" id="btn-tema" type="button"></button>
      </div>
    </div>
  </header>

  <main class="contenido" id="contenido"></main>

  <div class="avisos" id="avisos" aria-live="polite"></div>
  <noscript><p class="contenido">Esta página necesita JavaScript: los PDF se procesan en tu propio navegador.</p></noscript>
