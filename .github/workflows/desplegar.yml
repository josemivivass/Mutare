# En cada push a main, avisa al repositorio HomeLabDockers para que el servidor
# de casa se traiga el codigo nuevo y reconstruya Mutare al momento.
# Este trabajo corre en GitHub (gratis en repositorios publicos), no en casa:
# solo manda el aviso. Si el servidor esta apagado, su runner lo recoge al
# volver, y ademas el servidor revisa este repositorio cada 5 minutos.
#
# Necesita el secreto HOMELAB_TOKEN (ver LEEME.md, «Despliegue en el homelab»).
name: Actualizar en el homelab

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Avisar a HomeLabDockers
        env:
          TOKEN: ${{ secrets.HOMELAB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::Falta el secreto HOMELAB_TOKEN: el servidor se actualizara solo en unos 5 minutos."
            exit 0
          fi
          codigo=$(curl -sS -o respuesta.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/josemivivass/HomeLabDockers/dispatches \
            -d '{"event_type":"actualizar-app","client_payload":{"app":"mutare"}}')
          if [ "$codigo" != "204" ]; then
            echo "::error::GitHub respondio $codigo"; cat respuesta.txt; exit 1
          fi
          echo "Aviso enviado: el servidor actualizara Mutare en unos segundos."
